spring:
  application:
    name: financeiro-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeiro_casal}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: financeiro-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # O schema e gerenciado pelo Flyway; nunca deixar o Hibernate alterar.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    # Sem baseline automatico: se o banco ja tiver schema sem historico,
    # a migracao falha em vez de pular a V1 e deixar tabelas faltando.
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: false

  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:financeiro-casal-dev-secret-troque-em-producao-2026}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    default-categories: ${SEED_CATEGORIES:true}
  recurrence:
    cron: ${RECURRENCE_CRON:0 7 3 * * *}

logging:
  level:
    root: INFO
    com.financeiro: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
